/* ── CARD ── */
.card{
  position:relative;z-index:1;
  width:100%;max-width:490px;margin:0 16px;
  background:linear-gradient(170deg,#1b1b1f 0%,#0a0a0c 100%);
  border-radius:14px;
  border:2px solid rgba(225,29,46,.38);
  box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 40px rgba(225,29,46,.18),0 28px 70px rgba(0,0,0,.85);
  overflow:hidden;
  animation:up .4s cubic-bezier(.22,1,.36,1) both;
}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* faixas amarelas diagonais – esquerda e direita */
.card::before,.card::after{
  content:'';position:absolute;top:-30px;
  width:10px;height:160%;
  background:rgba(225,29,46,.45);
  border-radius:6px;
  z-index:0;
}
.card::before{left:-8px;transform:rotate(-13deg);}
.card::after {right:-8px;transform:rotate( 13deg);}

.card-inner{position:relative;z-index:1;padding:30px 34px 28px;}
.card-foot{position:relative;z-index:1;text-align:center;padding:12px 16px;font-size:11px;letter-spacing:.6px;color:rgba(230,205,205,.6);border-top:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.15);}

/* ── TOPO ── */
.topo{
  display:flex;align-items:stretch;gap:12px;
  padding-bottom:14px;
  border-bottom:2px solid rgba(225,29,46,.55);
  margin-bottom:22px;
}

.logo-img{
  width:104px;height:104px;
  object-fit:contain;flex-shrink:0;
  align-self:center;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));
}

/* bloco SCV ocupa toda a largura restante e empilha sigla + faixa */
.scv-bloco{
  flex:1;min-width:0;
  display:flex;flex-direction:column;
  justify-content:center;
  gap:0;
}

/* GARAGEIRO */
.scv-sigla{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:900;font-style:normal;
  font-size:clamp(32px,9vw,50px);
  line-height:1;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#fff;
  white-space:nowrap;
  text-shadow:
    2px 2px 0 rgba(0,0,0,.55),
    0 0 22px rgba(255,40,50,.5);
}

/* faixa amarela — 100% da largura do bloco */
.scv-faixa{
  display:block;
  background:linear-gradient(90deg,#b30f20,#e11d2e);
  color:#fff;
  font-family:'Roboto',sans-serif;
  font-size:8.5px;font-weight:900;
  letter-spacing:.5px;text-transform:uppercase;
  padding:4px 8px;
  border-radius:4px;
  margin-top:5px;
  width:100%;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ── LOCKOUT ── */
.lockout-bar{display:none;height:3px;background:rgba(239,83,80,.15);border-radius:2px;margin-bottom:13px;overflow:hidden;}
.lockout-bar.on{display:block;}
.lockout-progress{height:100%;background:linear-gradient(90deg,#ef5350,#c62828);transition:width 1s linear;}

/* ── MSG ── */
.msg{display:none;padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:13px;line-height:1.5;}
.msg.err {background:rgba(239,83,80,.15);border:1px solid rgba(239,83,80,.45);color:#ff9a94;}
.msg.ok  {background:rgba(67,160,71,.12);border:1px solid rgba(67,160,71,.3); color:#a5d6a7;}
.msg.warn{background:rgba(255,193,7,.10);border:1px solid rgba(255,193,7,.3); color:#ffe082;}
.msg.on  {display:block;}

/* ── SPINNER ── */
.spin-wrap{display:none;align-items:center;justify-content:center;gap:10px;padding:5px 0 10px;}
.spin-wrap.on{display:flex;}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.15);border-top-color:#ff4d57;border-radius:50%;animation:rot 1s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}
.spin-lbl{font-size:11px;color:rgba(235,210,210,.7);letter-spacing:1px;}

/* ── CAMPOS ── */
.fgrp{margin-bottom:12px;}

.finp-wrap{
  display:flex;align-items:center;
  background:#fff;
  border:2px solid rgba(255,255,255,.14);
  border-radius:10px;
  overflow:hidden;
  transition:border-color .2s,box-shadow .2s;
}
.finp-wrap:focus-within{
  border-color:#ff3b47;
  box-shadow:0 0 0 3px rgba(255,59,71,.25);
}

.ico-side{
  display:flex;align-items:center;justify-content:center;
  width:52px;flex-shrink:0;align-self:stretch;
  background:#fbeaea;color:#c8102e;font-size:17px;
  border-right:1.5px solid #f1c9cc;
}

.finp{
  flex:1;border:none;outline:none;background:transparent;
  padding:15px 16px 15px 13px;
  font-size:14px;font-weight:500;color:#1a0d0e;
  font-family:'Roboto',sans-serif;letter-spacing:.4px;
}
.finp::placeholder{color:#8a7072;font-weight:400;letter-spacing:1px;}
.finp.upper{text-transform:uppercase;}

.toggle-pw{
  background:none;border:none;cursor:pointer;
  padding:0 14px;color:#8a7072;font-size:16px;transition:color .2s;
}
.toggle-pw:hover{color:#c8102e;}
.toggle-pw:disabled{opacity:.4;cursor:not-allowed;}

/* ── BTN ENTRAR ── */
.btn-login{
  width:100%;padding:16px;margin-top:8px;
  background:linear-gradient(135deg,#e11d2e 0%,#9b0f1c 100%);
  border:none;border-radius:10px;
  color:#fff;font-family:'Roboto',sans-serif;
  font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 6px 22px rgba(225,29,46,.5);
  transition:all .2s;
}
.btn-login:hover{background:linear-gradient(135deg,#f23544,#b01222);transform:translateY(-2px);box-shadow:0 10px 28px rgba(225,29,46,.6);}
.btn-login:active{transform:translateY(0);}
.btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}

/* ── BTN LOGIN ÚNICO ── */
.btn-acesso{
  display:none;width:100%;padding:15px;margin-top:10px;
  background:linear-gradient(135deg,#2ea845 0%,#1a7030 100%);
  border:none;border-radius:10px;
  color:#fff;font-family:'Roboto',sans-serif;
  font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;
  align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 16px rgba(46,168,69,.4);
  transition:all .2s;
}
.btn-acesso:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(46,168,69,.5);}
.btn-acesso.on{display:flex;}

/* ── ESQUECEU SENHA ── */
.forgot{text-align:center;margin-top:16px;}
.forgot a{font-size:13px;color:rgba(235,190,190,.75);text-decoration:none;transition:color .2s;}
.forgot a:hover{color:#fff;}

@media(max-width:480px){
  .card-inner{padding:22px 18px 20px;}
  .logo-img{width:84px;height:84px;}
  .scv-faixa{font-size:8px;letter-spacing:.3px;}
}
</style>
</head>
<body>

<div class="card">

<script>
(function () {
'use strict';

// ═══════════════════════════════════════════════════════════════
//  [SEC-00] CONFIGURAÇÃO
// ═══════════════════════════════════════════════════════════════
var _API_URL = 'https://script.google.com/macros/s/AKfycbzG0Kdc-ipnPuxcQ1l17ZBVkSu6tsRA0Zn_eaeIsxy5tO6JnmoKJd4K6r0vOh4DvvvG/exec';

// ═══════════════════════════════════════════════════════════════
//  [SEC-02] RATE LIMITING
// ═══════════════════════════════════════════════════════════════
var _tentativas   = 0;
var _bloqueadoAte = 0;
var _lockoutTimer = null;
var MAX_TENT      = 5;
var BACKOFF_MS    = [0, 0, 30000, 60000, 120000];

function _getBloqueioRestante() { return Math.max(0, _bloqueadoAte - Date.now()); }
function _isBloqueado() { return _getBloqueioRestante() > 0; }

function _registrarFalha() {
  _tentativas++;
  var espera = _tentativas < BACKOFF_MS.length ? BACKOFF_MS[_tentativas] : 300000;
  if (espera > 0) {
    _bloqueadoAte = Date.now() + espera;
    _iniciarCountdown(espera);
  }
}

function _registrarSucesso() {
  _tentativas   = 0;
  _bloqueadoAte = 0;
  clearInterval(_lockoutTimer);
  document.getElementById('lockoutBar').classList.remove('on');
}

function _iniciarCountdown(duracao) {
  clearInterval(_lockoutTimer);
  var bar  = document.getElementById('lockoutBar');
  var prog = document.getElementById('lockoutProgress');
  bar.classList.add('on');
  _lockoutTimer = setInterval(function () {
    var restante = _getBloqueioRestante();
    if (restante <= 0) {
      clearInterval(_lockoutTimer);
      bar.classList.remove('on');
      document.getElementById('msgBox').className = 'msg';
      document.getElementById('btnLogin').disabled = false;
      return;
    }
    var pct = (restante / duracao) * 100;
    prog.style.width = pct.toFixed(1) + '%';
    var seg = Math.ceil(restante / 1000);
    _showMsg('🔒 Muitas tentativas. Aguarde ' + seg + 's.', 'err');
    document.getElementById('btnLogin').disabled = true;
  }, 500);
}

// ═══════════════════════════════════════════════════════════════
//  [SEC-04] ESTADO PRIVADO
// ═══════════════════════════════════════════════════════════════
var _urlDashboard   = '';
var _acessoLiberado = false;

// ═══════════════════════════════════════════════════════════════
//  INICIALIZAÇÃO
// ═══════════════════════════════════════════════════════════════
window.addEventListener('load', function () {
  var tk     = sessionStorage.getItem('gar_token');
  var mat    = sessionStorage.getItem('gar_matricula');
  var expira = parseInt(sessionStorage.getItem('gar_expira') || '0', 10);

  if (tk && mat) {
    if (Date.now() < expira) {
      window.location.href = 'garageiro.html';
      return;
    }
    _limparSessao();
  }

  document.getElementById('iMat').focus();

  document.getElementById('btnLogin').addEventListener('click', fazerLogin);
  document.getElementById('btnTogglePw').addEventListener('click', toggleSenha);

  document.getElementById('iMat').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('iSenha').focus(); }
  });
  document.getElementById('iSenha').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); fazerLogin(); }
  });
});

// ═══════════════════════════════════════════════════════════════
//  [SEC-10] LIMPA SENHA AO MINIMIZAR
// ═══════════════════════════════════════════════════════════════
window.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden' && !_acessoLiberado) {
    var inp = document.getElementById('iSenha');
    if (inp) inp.value = '';
  }
});

// ═══════════════════════════════════════════════════════════════
//  HELPERS UI
// ═══════════════════════════════════════════════════════════════
function toggleSenha() {
  var inp = document.getElementById('iSenha');
  var btn = document.getElementById('btnTogglePw');
  if (inp.disabled) return;
  inp.type = inp.type === 'password' ? 'text' : 'password';
  var oculto = inp.type === 'password';
  btn.setAttribute('aria-label', oculto ? 'Mostrar senha' : 'Ocultar senha');
  btn.querySelector('.ic-off').style.display = oculto ? '' : 'none';
  btn.querySelector('.ic-on').style.display  = oculto ? 'none' : '';
}

function _showMsg(texto, tipo) {
  var el = document.getElementById('msgBox');
  el.textContent = texto;
  el.className = 'msg ' + tipo + ' on';
}

function _setLoading(on, txt) {
  document.getElementById('spinWrap').classList.toggle('on', on);
  document.getElementById('spinLbl').textContent = txt || 'AUTENTICANDO...';
  document.getElementById('btnLogin').disabled    = on || _isBloqueado();
  document.getElementById('iMat').disabled        = on;
  document.getElementById('iSenha').disabled      = on;
  document.getElementById('btnTogglePw').disabled = on;
}

function irParaDashboard() {
  if (!_acessoLiberado || !_urlDashboard) {
    _showMsg('✗ Sessão inválida. Faça login novamente.', 'err');
    return;
  }
  _acessoLiberado = false;
  var destino = _urlDashboard;
  _urlDashboard = '';
  window.location.href = destino;
}

// ═══════════════════════════════════════════════════════════════
//  CHAMADA À API
// ═══════════════════════════════════════════════════════════════
async function _api(payload) {
  var ctrl  = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 15000);
  try {
    var resp = await fetch(_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
      signal: ctrl.signal,
      credentials: 'omit',
      referrerPolicy: 'no-referrer'
    });
    if (!resp.ok) throw new Error('HTTP_' + resp.status);
    return resp.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('TIMEOUT');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

function _msgErro(e) {
  if (!e || !e.message) return 'Erro de conexão. Tente novamente.';
  if (e.message === 'TIMEOUT')       return 'Tempo limite esgotado. Verifique a conexão.';
  if (e.message.startsWith('HTTP_')) return 'Falha no servidor (' + e.message + '). Tente mais tarde.';
  if (e instanceof TypeError)        return 'Sem conexão com o servidor. Verifique a internet.';
  return 'Erro de conexão. Tente novamente.';
}

// ═══════════════════════════════════════════════════════════════
//  [SEC-03] VALIDAÇÃO
// ═══════════════════════════════════════════════════════════════
function _validarInputs(matricula, senha) {
  if (!matricula || !matricula.trim()) return '⚠ Informe sua matrícula.';
  if (matricula.trim().length > 20)   return '⚠ Matrícula muito longa.';
  if (!senha)                         return '⚠ Informe sua senha.';
  if (senha.length < 4)               return '⚠ Senha muito curta (mín. 4 caracteres).';
  if (senha.length > 64)              return '⚠ Senha muito longa.';
  return null;
}

// ═══════════════════════════════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════════════════════════════
async function fazerLogin() {
  if (_isBloqueado()) return;

  var matricula = document.getElementById('iMat').value.trim().toUpperCase();
  var senha     = document.getElementById('iSenha').value;

  document.getElementById('msgBox').className = 'msg';

  var erroValidacao = _validarInputs(matricula, senha);
  if (erroValidacao) { _showMsg(erroValidacao, 'warn'); return; }

  _setLoading(true, 'AUTENTICANDO...');

  try {
    var loginResult = await _api({
      tipo: 'garageiroLogin',
      matricula: matricula,
      senha: senha
    });

    if (!loginResult || !loginResult.sucesso) {
      _registrarFalha();
      _setLoading(false);
      _showMsg('✗ Credenciais inválidas. Verifique e tente novamente.', 'err');
      document.getElementById('iSenha').value = '';
      document.getElementById('iSenha').focus();
      return;
    }

    _registrarSucesso();
    _showMsg('✓ ' + (loginResult.mensagem || 'Autenticado com sucesso.'), 'ok');
    _setLoading(true, 'PREPARANDO ACESSO...');

    var token      = loginResult.token;
    var nomeGuerra = loginResult.nomeGuerra;
    var mat        = loginResult.matricula;
    var perfil     = loginResult.perfil;

    var hkResult = await _api({
      tipo: 'garageiroHandoff',
      token: token,
      matricula: mat,
      nomeGuerra: nomeGuerra,
      perfil: perfil
    });

    _setLoading(false);
    _salvarSessao(token, mat, nomeGuerra, perfil);

    if (hkResult && hkResult.handoffKey) {
      _urlDashboard = 'garageiro.html?hk=' + encodeURIComponent(hkResult.handoffKey);
    } else {
      _urlDashboard = 'garageiro.html';
    }

    _acessoLiberado = true;

    // Redireciona automaticamente, sem etapa extra
    irParaDashboard();

  } catch (e) {
    _setLoading(false);
    _showMsg('✗ ' + _msgErro(e), 'err');
  }
}

// ═══════════════════════════════════════════════════════════════
//  [SEC-05] GESTÃO DE SESSÃO
// ═══════════════════════════════════════════════════════════════
function _salvarSessao(token, matricula, nomeGuerra, perfil) {
  var OITO_HORAS = 8 * 60 * 60 * 1000;
  sessionStorage.setItem('gar_token',      token);
  sessionStorage.setItem('gar_matricula',  matricula);
  sessionStorage.setItem('gar_nomeGuerra', nomeGuerra);
  sessionStorage.setItem('gar_perfil',     perfil);
  sessionStorage.setItem('gar_expira',     String(Date.now() + OITO_HORAS));
}

function _limparSessao() {
  ['gar_token','gar_matricula','gar_nomeGuerra','gar_perfil','gar_expira']
    .forEach(function (k) { sessionStorage.removeItem(k); });
}

window.irParaDashboard = irParaDashboard;
window.toggleSenha     = toggleSenha;

}());
</script>
